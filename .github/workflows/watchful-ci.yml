name: Watchful CI

on:
  pull_request:
    branches: ['watchful']
  push:
    branches: ['watchful']

jobs:
  test:
    name: Build and test
    runs-on: blacksmith-4vcpu-ubuntu-2404
    env: { CGO_ENABLED: 0 }
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v5
        with: { go-version: '1.25' }

      - name: Install media validation tools
        run: |
          command -v ffmpeg >/dev/null && command -v ffprobe >/dev/null || {
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          }

      - name: Build
        run: go build -ldflags "-s -w" -trimpath

      - name: Vet
        run: go vet ./pkg/core/... ./pkg/tcp/... ./pkg/rtsp/... ./pkg/aac/... ./pkg/h264/... ./pkg/h265/... ./pkg/mp4/... ./pkg/hls/... ./pkg/ivideon/... ./internal/http/... ./internal/rtsp/... ./internal/streams/...

      # Every package except the ones already broken at the upstream release tag
      # (stale test expectations in internal/ffmpeg and pkg/hap/tlv8; tests that no
      # longer compile in pkg/hap/camera, pkg/hap/hds and pkg/tuya) and the two
      # cgo-only device packages, which have no tests.
      - name: List test packages
        id: pkgs
        run: |
          pkgs=$(go list -e ./... | grep -v -E '/(internal/ffmpeg|pkg/hap/tlv8|pkg/hap/camera|pkg/hap/hds|pkg/tuya|pkg/alsa/device|pkg/v4l2/device)$' | tr '\n' ' ')
          echo "pkgs=$pkgs" >> "$GITHUB_OUTPUT"

      - name: Test
        run: go test ${{ steps.pkgs.outputs.pkgs }}

      # -race no longer needs cgo on linux/amd64, and enabling cgo breaks the
      # device packages (their .c files are generator inputs, not cgo sources).
      - name: Race test
        run: go test -race ${{ steps.pkgs.outputs.pkgs }}
