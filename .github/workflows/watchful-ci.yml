name: Watchful CI

on:
  pull_request:
    branches: ['watchful']
  push:
    branches: ['watchful']

jobs:
  test:
    name: Build and test
    runs-on: blacksmith-4vcpu-ubuntu-2404
    env: { CGO_ENABLED: 0 }
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v5
        with: { go-version: '1.25' }

      - name: Build
        run: go build -ldflags "-s -w" -trimpath

      - name: Vet
        run: go vet ./pkg/core/... ./pkg/tcp/... ./pkg/rtsp/... ./pkg/h264/... ./pkg/h265/... ./pkg/mp4/... ./pkg/hls/... ./pkg/ivideon/... ./internal/http/... ./internal/rtsp/...

      # Packages Watchful.Streaming depends on (RTSP ingest, H.264/H.265
      # depacketising, native HLS ingest, fMP4 mux). Upstream's full suite has known failures
      # unrelated to these paths.
      - name: Test
        run: go test ./pkg/core/... ./pkg/tcp/... ./pkg/rtsp/... ./pkg/h264/... ./pkg/h265/... ./pkg/mp4/... ./pkg/hls/... ./pkg/ivideon/... ./internal/http/... ./internal/rtsp/...

      - name: Race test HLS and MP4
        env: { CGO_ENABLED: 1 }
        run: go test -race ./pkg/hls/... ./pkg/mp4/... ./pkg/ivideon/...
