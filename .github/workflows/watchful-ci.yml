name: Watchful CI

on:
  pull_request:
    branches: ['watchful']
  push:
    branches: ['watchful']

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    env: { CGO_ENABLED: 0 }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with: { go-version: '1.25' }

      - name: Build
        run: go build -ldflags "-s -w" -trimpath

      - name: Vet
        run: go vet ./pkg/core/... ./pkg/tcp/... ./pkg/rtsp/... ./pkg/h264/... ./pkg/h265/... ./pkg/mp4/... ./internal/rtsp/...

      # Packages Watchful.Streaming depends on (RTSP ingest, H.264/H.265
      # depacketising, fMP4 mux). Upstream's full suite has known failures
      # unrelated to these paths.
      - name: Test
        run: go test ./pkg/core/... ./pkg/tcp/... ./pkg/rtsp/... ./pkg/h264/... ./pkg/h265/... ./pkg/mp4/... ./internal/rtsp/...
