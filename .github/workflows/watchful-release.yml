name: Watchful release

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Release tag to (re)build, e.g. v1.9.14-watchful.1. Empty builds this branch.'
        required: false
        default: ''
  push:
    branches: ['watchful']
    tags: ['v*']

permissions:
  contents: read
  id-token: write

env:
  IMAGE: us-docker.pkg.dev/watchful-global/watchful-docker-public/go2rtc

jobs:
  docker:
    name: Build and push image
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          # Full history + tags so `go build` stamps the tagged version.
          fetch-depth: 0

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch,enable=${{ inputs.ref == '' }}
            type=match,pattern=v(.*),group=1
            type=match,pattern=v(.*),group=1,value=${{ inputs.ref }},enable=${{ inputs.ref != '' }}

      # arm64 layers are emulated; the Blacksmith builder replaces buildx.
      - uses: docker/setup-qemu-action@v3
      - name: Setup Blacksmith Builder
        uses: useblacksmith/setup-docker-builder@v2
        with:
          cache-key: go2rtc

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v3
        with:
          token_format: access_token
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT_EMAIL }}

      - name: Login to Artifact Registry
        uses: docker/login-action@v4
        with:
          registry: us-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - name: Build and push
        uses: useblacksmith/build-push-action@v2
        with:
          context: .
          file: docker/Dockerfile
          platforms: |
            linux/amd64
            linux/arm64/v8
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
